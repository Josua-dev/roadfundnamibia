# Render Blueprint — one service, deploys the whole app.
# In the Render Dashboard: New > Blueprint > connect this repo.
# Docs: https://render.com/docs/infrastructure-as-code
#
# IMPORTANT: this project used to run as two separate services (a
# Node backend + a static-site frontend). They've been consolidated
# into one: the backend now serves the frontend's built files
# directly (see the static-serving block near the bottom of
# backend/server.js). This isn't just simplification -- it fixes a
# real bug: onrender.com is on the Public Suffix List, so two
# *.onrender.com services are treated as fully separate *sites* by
# the browser, which made the login cookie a genuine third-party
# cookie -- exactly the kind Chrome and Safari increasingly block or
# restrict by default. Serving everything from one origin eliminates
# that failure mode structurally.
#
# If you deployed the old two-service version previously, delete the
# old "roadfund-frontend" static site in the Render dashboard after
# this one is live -- it's no longer used.
#
# The database itself is NOT defined here — this project already has a
# Supabase Postgres project ("roadfund") with the schema applied and seed
# data. Grab its connection string from Project Settings > Database >
# Connection string ("Session pooler" -- Render's network doesn't support
# the Direct connection's IPv6 default) and paste it into DATABASE_URL
# when prompted during Blueprint creation.

services:
  - type: web
    name: roadfund
    runtime: node
    plan: free
    # No rootDir: the build needs access to both frontend/ and
    # backend/ from the repo root.
    # --include=dev is required here: NODE_ENV=production (below,
    # needed at runtime) is applied during the build too, and npm's
    # default behavior in that case is to silently skip
    # devDependencies -- which is exactly where @types/react,
    # typescript, and vite live. Without this flag, `tsc` fails with
    # a wall of "JSX.IntrinsicElements does not exist" errors, since
    # the JSX type augmentation @types/react provides never gets
    # installed. The backend's own `npm install` doesn't need this:
    # its only devDependency is nodemon, a dev-only convenience tool
    # that's correctly never needed at runtime.
    buildCommand: cd frontend && npm install --include=dev && npm run build && cd ../backend && npm install
    startCommand: node backend/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false   # paste your Supabase session-pooler connection string here
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: MAX_FILE_SIZE
        value: 10485760
      # Transactional emails go through Resend's HTTPS API (port 443,
      # which Render free DOES allow — unlike outbound SMTP which blocked
      # Gmail). Paste an API key from https://resend.com/api-keys.
      - key: RESEND_API_KEY
        sync: false
      # From address. Resend only allows onboarding@resend.dev until you
      # add + verify a domain; once you do, switch this to
      # "RoadSafe Namibia <noreply@YOUR-VERIFIED-DOMAIN>".
      - key: EMAIL_FROM
        value: RoadSafe Namibia <onboarding@resend.dev>
      # File storage (Supabase Storage, same project as the database).
      # Paste from Supabase Dashboard > Project Settings > API Keys
      # (the "secret" key -- Supabase's newer naming for what used to
      # be called service_role).
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: report-photos
      # Everything is one origin now, so this is mostly a formality --
      # kept so CORS still works correctly for local dev against a
      # deployed backend, or any other client that isn't this same
      # frontend. Render usually assigns exactly
      # https://<name>.onrender.com; if it picked something else
      # (e.g. a name clash), update this in the dashboard and redeploy.
      - key: ALLOWED_ORIGINS
        value: https://roadfund.onrender.com
      - key: FRONTEND_URL
        value: https://roadfund.onrender.com
